# Continuous integration for AI Match Analyst.
# Runs the unittest suite on every push and on every pull request to main.
# Save this file in the repo as: .github/workflows/tests.yml

name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        # If your tests call the football APIs, add the keys under
        # GitHub > Settings > Secrets and variables > Actions, then
        # uncomment and rename these to match your code:
        # env:
        #   FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python -m unittest discover -v
