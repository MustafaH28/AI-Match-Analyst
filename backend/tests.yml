# Continuous integration for AI Match Analyst.
# Runs the unittest suite on every push and on every pull request to main.
# Save this file in the repo as: .github/workflows/tests.yml

name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # httpx is needed by FastAPI's TestClient (test-only dependency)
          pip install httpx

      - name: Run unit tests
        working-directory: backend
        # External APIs are mocked in test_main.py, so no API keys are needed.
        run: python -m unittest discover -v
